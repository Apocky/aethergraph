name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Verify public boundary
        run: |
          npm test
          npm run check:release
      - name: Verify tag matches manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const m=JSON.parse(fs.readFileSync('manifest.json','utf8')); if (process.env.RELEASE_TAG !== m.version) { throw new Error('tag '+process.env.RELEASE_TAG+' does not match manifest '+m.version); }"
      - name: Build release archive
        run: |
          version="$(node -p "require('./manifest.json').version")"
          mkdir -p release/package
          cp main.js manifest.json styles.css release/package/
          (cd release/package && zip "../aethergraph-${version}.zip" main.js manifest.json styles.css)
          cp main.js manifest.json styles.css release/
          (cd release && sha256sum main.js manifest.json styles.css "aethergraph-${version}.zip" > SHA256SUMS.txt)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./manifest.json').version")"
          assets=(
            "release/aethergraph-${version}.zip"
            release/main.js
            release/manifest.json
            release/styles.css
            release/SHA256SUMS.txt
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "Aethergraph ${version}"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --generate-notes \
              --title "Aethergraph ${version}"
          fi
